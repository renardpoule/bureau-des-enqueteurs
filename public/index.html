<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bureau des enquêteurs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/home.css">
  <script type="module" src="/js/home.js"></script>
</head>
<body>
  <main id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-seal" aria-hidden="true">CD</div>
      <p class="login-kicker">Comité disciplinaire</p>
      <h1>Bureau des enquêteurs</h1>
      <p class="login-warning">Accès restreint — personnel habilité uniquement</p>
      <label class="field"><span>Identifiant</span><input name="username" autocomplete="username" required autofocus></label>
      <label class="field"><span>Mot de passe</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary login-submit" type="submit">Entrer</button>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-seal" aria-hidden="true">CD</span>
        <div>
          <strong>Bureau des enquêteurs</strong>
          <small>Comité disciplinaire</small>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="whoami" class="whoami"></span>
        <button id="btn-members" class="btn btn-ghost" type="button" hidden>Membres</button>
        <button id="btn-password" class="btn btn-ghost" type="button">Mot de passe</button>
        <button id="btn-logout" class="btn btn-ghost" type="button">Déconnexion</button>
      </div>
    </header>

    <main class="desk">
      <div class="desk-head">
        <div>
          <h1>Dossiers</h1>
          <p class="muted" id="case-count"></p>
        </div>
        <div class="desk-tools">
          <input id="case-search" type="search" placeholder="Rechercher un dossier…" aria-label="Rechercher un dossier">
          <select id="case-filter" aria-label="Filtrer par statut">
            <option value="">Tous les statuts</option>
            <option value="ouvert">Ouverts</option>
            <option value="en_cours">En cours</option>
            <option value="clos">Clos</option>
            <option value="classe">Classés sans suite</option>
          </select>
          <button id="btn-new-case" class="btn btn-primary" type="button" hidden>+ Nouveau dossier</button>
        </div>
      </div>
      <div id="cases" class="cases"></div>
    </main>
  </div>
</body>
</html>
